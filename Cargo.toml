[workspace]
resolver = "3"
members = [
    "crates/font-awesome-embed",
    "crates/font-awesome-embed-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Corey Alexander <coreyja@gmail.com>"]

[workspace.dependencies]
# Proc macro support
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# Optional integrations
maud = ">=0.26, <0.28"
